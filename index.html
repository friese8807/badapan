<!doctype html>
<html lang="ko" data-pal="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>올포오션</title>
<!-- 보안: 검색 노출 막기 · 다른 사이트에는 앱 주소(도메인)만 넘기기(카카오지도 확인용) · 허락한 서버(구글 Apps Script)하고만 통신 -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://script.google.com https://script.googleusercontent.com https://dapi.kakao.com https://t1.daumcdn.net https://*.kakaocdn.net; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://dapi.kakao.com https://*.daumcdn.net; img-src 'self' data: blob: https://*.daumcdn.net https://*.kakao.com https://*.kakaocdn.net https://tile.openstreetmap.org https://server.arcgisonline.com https://tiles.openseamap.org; style-src 'self' 'unsafe-inline'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="올포오션">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#007ab5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1722" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
<link rel="manifest" href="manifest.webmanifest?v=2">
<style>
/* ═══ app-kit.css — 모바일 웹앱 공통 (화면 채우기 · 로딩 · 스와이프 · 시트) ═══
   색은 :root 의 토큰만 바꿔서 앱마다 맞춘다. --solid 는 탭바/하단 띠 색이며 html 배경과 같아야 한다. */
:root{
  --bg:#f3f5f8; --solid:#ffffff; --ink:#12151c; --muted:#6b7280; --line:rgba(18,21,28,.10);
  --accent:#3b6cf6; --danger:#e5484d;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#10141b; --solid:#171c25; --ink:#f2f4f8; --muted:#9aa3b2; --line:rgba(255,255,255,.12); color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── 1. 화면 채우기 (위아래 공백 제거) ──
   · html 배경 = 하단 띠 색(--solid): 아이폰이 그리지 않는 맨 아래 칸이 탭바와 이어져 보인다.
   · 문서는 스크롤하지 않고(#sc 만 스크롤) 탭바는 fixed 가 아닌 flex 맨 아래 칸에 둔다.
   · --app-h 는 app-kit.js 의 fixViewport() 가 실제 화면 높이로 넣어 준다. */
html{height:100%;background:var(--solid);overflow:hidden}
body{margin:0;height:var(--app-h,100%);overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);overscroll-behavior:none;-webkit-text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ak-top{flex:none;display:flex;align-items:center;gap:8px;background:var(--bg);
  padding:calc(8px + var(--sat)) max(16px,var(--sar)) 8px max(16px,var(--sal))}
.ak-top h1{flex:1;margin:0;font-size:20px;font-weight:800}
#sc{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:4px max(16px,var(--sar)) 20px max(16px,var(--sal))}
.ak-tabs{flex:none;display:flex;background:var(--solid);border-top:1px solid var(--line);
  padding:6px max(8px,var(--sar)) max(6px,calc(var(--sab) - 14px)) max(8px,var(--sal))}
.ak-tabs button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:600;color:var(--muted);
  padding:6px 0;display:grid;gap:2px;justify-items:center;cursor:pointer}
.ak-tabs button .i{font-size:20px;line-height:1}
.ak-tabs button.on{color:var(--accent)}
/* 아이폰은 16px 보다 작은 입력칸을 누르면 화면을 확대한다 */
input,select,textarea{font-size:16px}
button{touch-action:manipulation}

/* ── 2. 로딩 ── */
/* 2-1 첫 화면: JS 가 뜨기 전부터 보이는 아이콘 + 문구 */
.ak-boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);text-align:center;transition:opacity .25s}
.ak-boot.out{opacity:0;pointer-events:none}
.ak-boot img{width:84px;height:84px;border-radius:20px;animation:ak-breathe 1.6s ease-in-out infinite}
.ak-boot p{margin:14px 0 0;color:var(--muted);font-size:14px}
@keyframes ak-breathe{50%{transform:scale(.94);opacity:.75}}
/* 2-2 누른 동작 처리 중: 위쪽 진행 막대 + 알약 + 누른 버튼 스피너 */
.ak-bar{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;pointer-events:none;opacity:0;transition:opacity .2s;overflow:hidden;
  background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ak-bar.on{opacity:1}
.ak-bar::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;border-radius:3px;background:var(--accent);animation:ak-bar 1.1s ease-in-out infinite}
@keyframes ak-bar{to{left:100%}}
.ak-pill,.ak-toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));z-index:61;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;
  padding:9px 16px;border-radius:999px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 6px 24px rgba(0,0,0,.22)}
.ak-pill{display:flex;align-items:center;gap:8px}
.ak-pill.on,.ak-toast.on{opacity:1;transform:translate(-50%,0)}
.ak-pill.hidden{opacity:0!important}
.ak-pill.top{top:calc(14px + var(--sat));bottom:auto}
.ak-pill .e{display:inline-block;animation:ak-hop .5s ease-in-out infinite alternate}
@keyframes ak-hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-4px) rotate(6deg)}}
.ak-pill .d i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:50%;background:currentColor;animation:ak-dot 1.2s infinite}
.ak-pill .d i:nth-child(2){animation-delay:.2s}.ak-pill .d i:nth-child(3){animation-delay:.4s}
@keyframes ak-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.is-busy{position:relative;pointer-events:none;opacity:.6}
.is-busy::after{content:"";position:absolute;right:12px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;
  border:2px solid currentColor;border-right-color:transparent;animation:ak-spin .7s linear infinite}
/* 2-3 배경 새로고침: 새로고침 아이콘만 돈다 */
.ak-icon-btn{border:0;background:none;color:inherit;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer}
.ak-spin{animation:ak-spin .8s linear infinite}
@keyframes ak-spin{to{transform:rotate(360deg)}}

/* ── 3. 스와이프 ── */
.ak-in-l{animation:ak-in-l .22s ease-out}.ak-in-r{animation:ak-in-r .22s ease-out}
@keyframes ak-in-l{from{transform:translateX(28px);opacity:0}}
@keyframes ak-in-r{from{transform:translateX(-28px);opacity:0}}
.ak-hscroll{overflow-x:auto;scrollbar-width:none;touch-action:pan-x;overscroll-behavior:contain}
.ak-hscroll::-webkit-scrollbar{display:none}

/* ── 4. 바텀시트 (끌어서 열고 닫기) ── */
.ak-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.ak-scrim.on{opacity:1;pointer-events:auto}
.ak-sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--solid);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding:0 max(18px,var(--sar)) calc(18px + var(--sab)) max(18px,var(--sal))}
.ak-sheet.on{transform:translateY(0)}
.ak-sheet.dragging{transition:none}
/* 시트 아래로 같은 색을 이어 붙여 아이폰 하단 틈을 가린다 */
.ak-sheet::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 1px);height:200px;background:var(--solid)}
.ak-grab{flex:none;padding:8px 0 12px;touch-action:none;cursor:grab}
.ak-grab::before{content:"";display:block;width:40px;height:5px;border-radius:9px;margin:0 auto;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.ak-sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

@media (prefers-reduced-motion:reduce){
  .ak-bar::before,.ak-pill .e,.ak-pill .d i,.is-busy::after,.ak-spin,.ak-boot img{animation-duration:2.5s}
  .ak-in-l,.ak-in-r{animation:none}.ak-sheet,.ak-scrim{transition:none}
}

/* ── 5. 상태·오류·예시 표시 ── */
/* 숫자는 자릿수가 흔들리지 않게 */
.num{font-variant-numeric:tabular-nums}
/* 갱신 상태: <span class="ak-status"><i class="ak-dot live"></i>14:32 갱신</span> */
.ak-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ak-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.ak-dot.live{background:#22c55e;animation:ak-pulse 1.8s infinite}
.ak-dot.off{background:var(--danger)}
@keyframes ak-pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
/* 예시 데이터로 보는 중 */
.ak-demo{flex:none;background:var(--ink);color:var(--bg);text-align:center;font-size:12.5px;padding:calc(6px + var(--sat)) 6px 6px}
.ak-demo:not([hidden]) + .ak-top{padding-top:8px}
/* 앱 오류 */
.ak-err{flex:none;background:var(--danger);color:#fff;font-size:12.5px;line-height:1.4;padding:calc(6px + var(--sat)) 12px 6px;overflow-wrap:anywhere}
/* 빈 화면·불러오기 실패 */
.ak-empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;padding:36px 16px}
.ak-empty button{margin-top:12px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:inherit;font-weight:600;border-radius:10px;padding:8px 16px}
/* 선 아이콘: <svg class="ak-ic" viewBox="0 0 24 24"><path …/></svg> — 글자색을 따라간다 */
.ak-ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.ak-dot.live{animation:none}}
/* ══ 올포오션 공통 ══ */
/* 올포랜드 CI 심볼 색: 파랑 #007AB5 · 초록 #89B542 · 회색 #4D4C4F */
:root{ --ci-blue:#007ab5; --ci-green:#89b542; --ci-gray:#4d4c4f;
  --accent:#007ab5; --accent2:#5f8a22; --ink:#26282b; --muted:#6a6b70; --bg:#f1f5f8; --solid:#ffffff; --card:#ffffff; --soft:#e6eff5;
  --go:#5f8a22; --warn:#b97806; --stop:#cc3b2b; --star:#e0a100; --r:16px; }
@media (prefers-color-scheme:dark){ :root{ --accent:#3ea6dc; --accent2:#a3cf5f; --ink:#f1f3f5; --muted:#9aa4ad; --bg:#0b1722; --solid:#112130; --card:#14283a; --soft:#1b3348;
  --go:#a3cf5f; --warn:#e5b24a; --stop:#f07462; } }
body{font-size:15px}
.ak-top h1{display:flex;align-items:center;gap:8px}
.ak-top h1 .logo{width:30px;height:30px;flex:none;background:#fff;border-radius:8px;padding:3px;object-fit:contain}
.ak-tabs button svg{width:23px;height:23px}
.sec{margin:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{margin:0;font-size:15px;font-weight:800}
.sec a,.sec button.link{font-size:13px;color:var(--accent);background:none;border:0;font-weight:700;padding:6px 0;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row .grow{flex:1;min-width:0}
.t{font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.list>.it{padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.list>.it:first-child{border-top:0}
.list>.it:active{background:var(--soft)}
.dd{flex:none;min-width:48px;text-align:center;font-weight:800;font-size:13px;padding:5px 6px;border-radius:9px;
  background:var(--soft);color:var(--ink);font-variant-numeric:tabular-nums}
.dd.hot{background:color-mix(in srgb,var(--stop) 15%,transparent);color:var(--stop)}
.dd.mid{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.dd.done{opacity:.5}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-right:4px;vertical-align:1px}
.tag.pre{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tag.alf{background:color-mix(in srgb,var(--ci-blue) 14%,transparent);color:var(--ci-blue)}
.tag.ltm{background:color-mix(in srgb,#7b4dc4 15%,transparent);color:#7b4dc4}
@media (prefers-color-scheme:dark){.tag.alf{color:#69b8ea}.tag.ltm{color:#b495ea}}
.sig{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;white-space:nowrap}
.sig::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}
.sig.go{color:var(--go)}.sig.warn{color:var(--warn)}.sig.stop{color:var(--stop)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;
  border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:5px 11px 5px 5px;font-size:13px;font-weight:600}
.person i{font-style:normal;font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:2px 7px;background:var(--accent)}
.person i.trip{background:var(--ci-green)}.person i.half{background:var(--warn)}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar>b{display:block;height:100%;background:var(--accent);border-radius:9px}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;margin:0 0 8px;font:inherit;font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:11px;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vote{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 4px;font:inherit;font-weight:700;cursor:pointer;min-height:46px}
.vote b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.vote.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:14px;margin:8px 0 4px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.cm{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.cm .who{font-weight:700;font-size:13px}.cm .when{color:var(--muted);font-size:12px;margin-left:6px}
.cm button{float:right;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:4px}
.field{display:grid;gap:5px;margin:0 0 12px;font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.fc th,.fc td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}
.fc th{color:var(--muted);font-weight:600;font-size:12px}
.fc td:first-child,.fc th:first-child{text-align:left}
.fc .over{color:var(--stop);font-weight:800}
.tides{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.tdc{margin:4px 0 6px}.tdc svg{width:100%;height:auto;display:block;overflow:visible}
.tdc .gr{stroke:var(--line);stroke-width:1}.tdc .ax{font-size:10px;fill:var(--muted)}
.tdc .tg1{stop-color:#7fb8e6;stop-opacity:.45}.tdc .tg2{stop-color:#7fb8e6;stop-opacity:.04}
.tdc .tln{fill:none;stroke:#4f93c9;stroke-width:2.4;stroke-linejoin:round}
.tdc .tdot.hi{fill:#2f7fc0;stroke:var(--solid);stroke-width:2}.tdc .tdot.lo{fill:#e08a3a;stroke:var(--solid);stroke-width:2}
.tdc .tlb{font-size:10.5px;font-weight:700}.tdc .tlb.hi{fill:#2f7fc0}.tdc .tlb.lo{fill:#c26d20}
.tdc .tnow{stroke:var(--stop);stroke-width:1.2;stroke-dasharray:3 3}.tdc .tnowd{fill:var(--stop);stroke:var(--solid);stroke-width:2}
.tdc figcaption{font-size:13px;margin-top:4px}
@media (prefers-color-scheme:dark){.tdc .tln{stroke:#8cc2ea}.tdc .tlb.hi{fill:#8cc2ea}.tdc .tlb.lo{fill:#f2b57a}.tdc .tdot.hi{fill:#8cc2ea}.tdc .tdot.lo{fill:#f2b57a}}
.tide{background:var(--soft);border-radius:10px;padding:7px 4px;text-align:center;font-size:12px}
.tide b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:12.5px;line-height:1.55}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
.switch input{width:46px;height:28px;accent-color:var(--accent)}
.menu .it{display:flex;align-items:center;gap:10px}
.menu .it .grow{flex:1}
.menu .it .chev{color:var(--muted)}
.diag{color:var(--muted);font-size:11px;line-height:1.5;margin-top:16px}
.badge{display:inline-block;min-width:20px;text-align:center;background:var(--stop);color:#fff;border-radius:999px;font-size:11.5px;font-weight:800;padding:1px 6px}
.star{border:0;background:none;color:var(--muted);padding:6px;cursor:pointer;line-height:0}
.star.on{color:var(--star)}
.star svg{width:24px;height:24px}
.star.on svg{fill:currentColor}

/* 로그인·잠금 화면 */
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;
  padding:calc(28px + var(--sat)) max(20px,var(--sar)) calc(24px + var(--sab)) max(20px,var(--sal))}
.gate .in{max-width:420px;margin:0 auto}

:root{--r:10px}

.site .nodata{color:var(--sea-muted)}

.legend i.none{background:#9aa4ad}

.mk-canvas{position:absolute;inset:0}

.mk{background:none;border:0}
/* 현장 핀: 신호등 점 + 숫자 꼬리표 */
.mpin{position:absolute;left:-9px;top:-9px;display:flex;align-items:center;gap:4px;white-space:nowrap;pointer-events:auto}
.mpin i{flex:none;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);background:var(--sea-go)}
.mpin.warn i{background:var(--sea-warn)}.mpin.stop i{background:var(--sea-stop);animation:pinpulse 1.6s infinite}
.mpin b{background:var(--sea);color:var(--sea-ink);font:800 11.5px/1 ui-monospace,Menlo,monospace;padding:4px 6px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mpin em{font-style:normal;font-size:11px;font-weight:700;color:#0b2233;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.mpin.lft{left:auto;right:-9px;flex-direction:row-reverse}
.mpin.sm{left:-7px;top:-7px}.mpin.sm i{width:14px;height:14px;border-width:2px}.mpin.sm b{font-size:10px;padding:2px 4px}
.mpin.pick{left:-11px;top:-11px}.mpin.pick i{width:22px;height:22px;background:var(--accent);border-width:4px}
@keyframes pinpulse{0%{box-shadow:0 0 0 0 rgba(255,111,94,.7)}70%{box-shadow:0 0 0 10px rgba(255,111,94,0)}100%{box-shadow:0 0 0 0 rgba(255,111,94,0)}}
@media (prefers-reduced-motion:reduce){.mpin.stop i{animation:none}}
/* 공고 묶음 */
.bdot{position:absolute;left:-9px;top:-9px;min-width:18px;height:18px;border-radius:9px;background:var(--ci-blue);color:#fff;border:2px solid #fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);padding:0 3px}
.bdot.org{background:#fff;color:var(--ci-blue);border:2px dashed var(--ci-blue)}
.bgrp{position:absolute;left:-15px;top:-15px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.bgrp b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ci-blue);color:#fff;border:3px solid #fff;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.bgrp.hot b{background:var(--stop)}.bgrp.mid b{background:#d38b00}
.bgrp.org b{background:#fff;color:var(--ci-blue);border:2px dashed var(--ci-blue)}
.bgrp span{font-size:11px;font-weight:800;color:#0b2233;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.bgrp.on b{outline:3px solid var(--ci-green);outline-offset:1px}
/* 사업 핀 */
.ppin{position:absolute;left:-8px;top:-8px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.ppin i{width:16px;height:16px;border-radius:4px;transform:rotate(45deg);background:var(--ci-blue);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.ppin.ltm i{background:#7b4dc4}
.ppin.org i{background:#fff;border:2px dashed var(--ci-blue)}.ppin.ltm.org i{border-color:#7b4dc4}
.ppin b{font-size:11px;font-weight:800;color:#0b2233;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.ppin span{font-size:10.5px;font-weight:800;background:#fff;color:#26282b;border-radius:5px;padding:1px 4px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin:6px 2px 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--sea-go)}
.legend i.warn{background:var(--sea-warn)}.legend i.stop{background:var(--sea-stop)}.legend i.bid{background:var(--ci-blue)}
.legend i.bid.org{background:#fff;border:2px dashed var(--ci-blue)}.legend i.alfc{background:var(--ci-blue);border-radius:2px}.legend i.ltmc{background:#7b4dc4;border-radius:2px}
.seg1{flex:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:0 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:42px}

/* 공고: 참여·연차 */
.join{display:inline-block;font-weight:800;color:var(--accent2);margin-right:6px}
.join::before{content:"🙋 "}
.tag.yr{background:color-mix(in srgb,var(--ci-green) 20%,transparent);color:var(--accent2)}
.vote.yes.on{border-color:var(--accent2);background:color-mix(in srgb,var(--ci-green) 18%,transparent);color:var(--accent2)}
.joiners{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px;font-size:13px}
.joiners>b{color:var(--accent2);margin-right:2px}
.joiners .person{padding:5px 11px}
.acts{display:flex;gap:8px;margin:8px 0 2px}
.act{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 4px;font:inherit;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}
.act .ak-ic{width:20px;height:20px;color:var(--accent)}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}

.hrow{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;background:var(--card)}

.hrow .y{flex:none;font-size:13px;background:var(--soft);border-radius:6px;padding:3px 6px;font-variant-numeric:tabular-nums;align-self:flex-start}
.hkv{display:grid;grid-template-columns:76px 1fr;gap:4px 8px;font-size:13px;margin:8px 0 0}
.hkv dt{color:var(--muted)}.hkv dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.mem{display:inline-block;background:var(--soft);border-radius:6px;padding:1px 6px;margin:0 4px 3px 0;font-size:12.5px}
.sub.hist{margin-top:3px}
/* 소식 */
.ak-top .bell{position:relative}
.ak-top .bell .bn[hidden]{display:none}
.ak-top .bell .bn{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--stop);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--accent)}
.news.new{background:color-mix(in srgb,var(--ci-green) 10%,transparent)}
.news .nic{flex:none;width:28px;font-size:18px;text-align:center}

/* ══ 2차 화면 (2026-11) ══ */
:root{--p-go:#e3f2d3;--p-go-ink:#3c6b12;--p-warn:#fdebc8;--p-warn-ink:#9a5b00;--p-stop:#fddcd7;--p-stop-ink:#b3261e;--p-none:#e8ecf0;--p-none-ink:#5f6b76;
  --p-blue:#dcecf8;--p-blue-ink:#0b5c8a;--p-violet:#ebe3fa;--p-violet-ink:#5b3aa0;--chip:#eaf2f9;--bc-title:#0b6aa6}

  --p-blue:#13324a;--p-blue-ink:#8cc8ef;--p-violet:#2c2346;--p-violet-ink:#c6b2f2;--chip:#1a3044;--bc-title:#6cbcef}}
.sig.go{color:var(--p-go-ink)}.sig.warn{color:var(--p-warn-ink)}.sig.stop{color:var(--p-stop-ink)}.sig.none{color:var(--p-none-ink)}
/* 오늘: 누르는 타일 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;border-radius:14px;padding:10px 9px 9px;font:inherit;text-align:left;cursor:pointer;min-width:0}
.tile .ti .ak-ic{width:19px;height:19px}
.tile b{font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.tile span{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile em{font-style:normal;font-size:10.5px;opacity:.75}
.tile:active{transform:scale(.97)}
.t-new{background:var(--p-blue);color:var(--p-blue-ink)}.t-soon{background:var(--p-warn);color:var(--p-warn-ink)}
.t-sea{background:var(--p-stop);color:var(--p-stop-ink)}.t-away{background:var(--p-violet);color:var(--p-violet-ink)}
/* 공고 카드 (나라장터 알림 스타일) */
.bcl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:10px}
.bc{padding:13px 14px 12px;border-top:1px solid var(--line);cursor:pointer}
.bc:first-child{border-top:0}
.bc:active{background:var(--soft)}
.bc-t{display:flex;gap:6px;align-items:flex-start}
.bc-t .grow{flex:1;min-width:0;color:var(--bc-title);font-weight:800;font-size:15.5px;line-height:1.38;overflow-wrap:anywhere}
.newb,.preb,.rndb{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-right:6px;vertical-align:2px}
.newb{background:#fff1dc;color:#c46a00}.rndb{background:var(--p-violet);color:var(--p-violet-ink)}.preb{background:var(--p-blue);color:var(--p-blue-ink)}
@media (prefers-color-scheme:dark){.newb{background:#43300e;color:#f4c46a}}
.bstar{flex:none;border:0;background:none;color:var(--accent);padding:2px;cursor:pointer;line-height:0}
.bstar .ak-ic{width:20px;height:20px}.bstar.on{color:var(--star)}.bstar.on .ak-ic{fill:currentColor}
.chs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ch{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:8px;padding:4px 8px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.ch i{font-style:normal;color:var(--muted);font-size:11.5px}
.ch.org{font-weight:800}
.ch.amt b{color:var(--bc-title);font-weight:800}
.ch.yr{background:var(--p-go);color:var(--p-go-ink);font-weight:800}
.ddb{font-weight:800;color:var(--muted);margin-left:2px}.ddb.hot{color:var(--p-stop-ink)}.ddb.mid{color:var(--p-warn-ink)}
.joinbar{margin-top:8px;background:var(--p-go);color:var(--p-go-ink);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:800}
.joinbanner{background:var(--p-go);color:var(--p-go-ink);border-radius:12px;padding:10px 12px;margin:10px 0 2px;font-weight:700}
.joinbanner .people{margin-top:6px}.joinbanner .person{background:rgba(255,255,255,.55);color:inherit}
/* 곧 나올 연차 사업 */
.uc2 .bgrid{margin-top:7px}
.expb{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;border:1.5px dashed var(--p-violet-ink);color:var(--p-violet-ink)}
.alfb{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--p-go);color:var(--p-go-ink)}
.ddtag.up{background:var(--p-violet);color:var(--p-violet-ink)}
.kmbar{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;height:74px;align-items:end}
.kmb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.kmb i{display:block;width:70%;background:var(--line);border-radius:3px 3px 0 0}.kmb.on i{background:var(--p-violet-ink);opacity:.75}
.kmb b{font-size:10px;color:var(--p-violet-ink);line-height:14px}.kmb span{font-size:10px;color:var(--muted);margin-top:2px}
.ksec{display:flex;align-items:center;gap:8px;margin:14px 2px 7px;font-size:15px}.ksec:first-child{margin-top:4px}

.ksec span{color:var(--muted);font-size:13px}.ksec.kp b:before{background:var(--p-blue-ink)}.ksec.kr b:before{background:var(--p-violet-ink)}
.ksec.kb b:before{background:var(--stop)}
.uc2 .bc-title{color:var(--ink)}
/* 부재 */
.absg{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:3px 0}
.abst{font-size:11.5px;font-weight:800;border-radius:7px;padding:3px 8px}
.abst.v{background:var(--p-violet);color:var(--p-violet-ink)}.abst.h,.abst.q{background:var(--p-warn);color:var(--p-warn-ink)}.abst.t{background:var(--p-go);color:var(--p-go-ink)}
.absp{font-size:13px;font-weight:600;background:var(--soft);border-radius:999px;padding:3px 10px}
.absp i{font-style:normal;font-size:11px;color:var(--muted);margin-left:4px}
.absday{border-top:1px solid var(--line);padding:9px 0}
.absday.wk .absh b{color:var(--stop)}
.absh{display:flex;align-items:center;gap:6px;margin-bottom:4px}
/* 한눈에 보기 표 */
.absw{margin-bottom:10px}
.agrid{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.agrid thead th{font-weight:600;color:var(--muted);padding:2px 0 7px;cursor:pointer;border-left:1px solid var(--line)}
.agrid thead th:first-child{width:62px;border-left:0;cursor:default}
.agrid thead th b{display:block;font-size:15px;color:var(--ink)}
.agrid thead th span{font-size:11px}
.agrid thead th.now b,.agrid thead th.now span{color:var(--bc-title)}
.agrid thead th.sel{background:var(--chip);border-radius:8px 8px 0 0}
.agrid thead th.past{opacity:.5}
.agrid tbody th{text-align:left;font-weight:500;padding:0 4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:36px}
.agrid tbody th.on{font-weight:800}
.agrid td{border-left:1px solid var(--line);border-top:1px solid var(--line);padding:0;height:36px}
.agrid tbody tr:first-child td,.agrid tbody tr:first-child th{border-top:2px solid var(--line)}
.agrid tbody tr th{border-top:1px solid var(--line)}
.agrid td.now{background:color-mix(in srgb,var(--bc-title) 6%,transparent)}
.agrid td.past{opacity:.5}
.ac{height:100%;display:grid;place-items:center;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;position:relative}
.ac.v{background:var(--p-go);color:var(--p-go-ink)}
.ac.t{background:var(--p-blue);color:var(--p-blue-ink)}
.ac.p{background:linear-gradient(90deg,transparent var(--l),var(--p-go) var(--l),var(--p-go) calc(var(--l) + var(--w)),transparent 0);color:var(--ink)}
.ac.p span{position:relative;font-weight:600;font-size:11.5px}
.alg{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:8px}
.tpn{position:absolute;left:-8px;top:-8px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tpop{position:absolute;left:0;bottom:22px;transform:translateX(-50%);width:max-content;max-width:250px;background:#13202e;color:#fff;border-radius:12px;padding:10px 13px;box-shadow:0 6px 18px rgba(0,0,0,.4);font-size:12.5px;line-height:1.45;white-space:normal;cursor:pointer}
.tpop:after{content:'';position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;background:#13202e;transform:rotate(45deg)}
.tpop b{font-size:13.5px}.tpop small{display:block;color:#a9b8c6;font-size:11.5px}.tpg+.tpg{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.15)}.tpop em{display:block;font-style:normal;color:#8cc8ef;font-size:11px;margin-top:5px}
.tinfo{margin-top:8px;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:13px}.tih{font-weight:800;margin-bottom:4px;color:var(--bc-title)}.tir{padding:6px 0;border-top:1px solid var(--line)}.tir span{color:var(--muted);font-size:12px}.tir div{color:var(--muted);margin-top:2px}
.tpn .ttip{display:none;position:absolute;left:-6px;bottom:24px;min-width:200px;max-width:260px;white-space:normal;background:#13202e;color:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 4px 14px rgba(0,0,0,.35);font-size:12.5px;line-height:1.45}
.tpn.open .ttip{display:block}.tpn .ttip div+div{margin-top:6px}.tpn .ttip small{display:block;color:#a9b8c6;font-size:11.5px}
.agrid td[data-abs-cell]{cursor:pointer}.agrid td.pick{outline:2px solid var(--bc-title);outline-offset:-2px}
#sb{position:relative}
.apop{position:absolute;z-index:20;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px}
.apop:before{content:'';position:absolute;top:-7px;left:calc(var(--ax) - 7px);width:12px;height:12px;background:var(--solid);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.apx{position:absolute;right:6px;top:4px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;padding:2px 8px}
.aph{margin:0 24px 6px 0}.aph b{font-size:16px}.aph span{font-size:12.5px;color:var(--muted)}
.apt{font-size:15px;margin-top:4px}.apt small{color:var(--muted);font-weight:600}
.apr{display:flex;gap:8px;color:var(--muted);margin:3px 0 0 24px;line-height:1.4}.apr span{flex:none;font-weight:700;color:var(--ink);opacity:.7}
.tpn i{flex:none;width:16px;height:16px;border-radius:50%;background:#7cc242;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tpn b{background:#1f7fd0;color:#fff;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.3);max-width:200px;overflow:hidden;text-overflow:ellipsis}

.alg i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.alg i.v{background:var(--p-go)}.alg i.t{background:var(--p-blue)}.alg i.p{background:linear-gradient(90deg,transparent 50%,var(--p-go) 50%);border:1px solid var(--p-go)}
/* 현장: 파스텔 카드 · 3일 띠 */
.lights2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:10px}

.lights2 span{font-size:11.5px;font-weight:700}
.lights2 .go{background:var(--p-go);color:var(--p-go-ink)}.lights2 .warn{background:var(--p-warn);color:var(--p-warn-ink)}.lights2 .stop{background:var(--p-stop);color:var(--p-stop-ink)}.lights2 .none{background:var(--p-none);color:var(--p-none-ink)}
.site2{border-radius:var(--r);padding:11px 11px 9px;cursor:pointer;min-width:0;border:1px solid transparent}
.site2.go{background:var(--p-go)}.site2.warn{background:var(--p-warn)}.site2.stop{background:var(--p-stop);border-color:color-mix(in srgb,var(--p-stop-ink) 45%,transparent)}.site2.none{background:var(--p-none)}
.site2 .v{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:800;margin-top:5px;white-space:nowrap;color:var(--ink)}
.site2 .v small{font-size:12px;color:var(--muted);font-weight:600;margin-left:1px}
.site2 .t{font-size:13.5px;margin-top:3px}
.site2:active{filter:brightness(.97)}
.site2 .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.site2 .nx{margin-top:6px;font-size:12px}
.wxc{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.wxc div{background:color-mix(in srgb,var(--solid) 72%,transparent);border-radius:9px;padding:5px 7px;min-width:0}
.wxc i{display:flex;align-items:center;gap:3px;font-style:normal;font-size:11px;color:var(--muted);font-weight:600}.wxc i .ak-ic{width:13px;height:13px}
.wxc b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:800;color:var(--ink);white-space:nowrap}
.wxc b small{font-size:11px;color:var(--muted);font-weight:600;margin-left:1px;font-family:inherit}
.sA .t{font-size:15.5px;font-weight:800}
.seaact{display:grid;grid-template-columns:1.1fr 1fr;gap:8px;margin:10px 0 4px}
.seaact button{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:14px;font:inherit;font-weight:800;font-size:14.5px;padding:12px 10px;cursor:pointer;min-height:52px}
.sa-add{background:var(--accent);color:#fff;border:0}.sa-add span{font-size:20px;line-height:1;font-weight:600}
.sa-wx{background:var(--card);color:var(--ink);border:1px solid var(--line)}.sa-wx .ak-ic{width:18px;height:18px;flex:none;color:var(--accent)}
.sa-wx span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}.sa-wx em{font-style:normal;font-size:11px;font-weight:600;color:var(--muted)}
.sa-wx:disabled .ak-ic{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hstrip{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:8px;gap:0;background:rgba(0,0,0,.06)}
.hstrip i{flex:1}.hstrip i.go{background:#6fae3a}.hstrip i.warn{background:#e2a23a}.hstrip i.stop{background:#d9534a}.hstrip i.none{background:transparent}
.mpin.go i{background:#6fae3a}.mpin.warn i{background:#f0a531}.mpin.stop i{background:#e2483d}
.tbar{display:flex;align-items:center;gap:10px;margin:8px 0 6px}
.tbar input{flex:1;accent-color:var(--accent);height:28px}
.tbar{align-items:flex-end}
.play{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:13px;cursor:pointer}
/* 3일 그래프 */
.tsc{margin:6px 0 10px;position:relative}
.tsc figcaption{font-size:13px;font-weight:800;margin-bottom:2px}
.tsc svg{width:100%;height:auto;display:block;touch-action:pan-y}
.tsc text{font-size:9.5px;fill:var(--muted)}
.tsc .gr{stroke:var(--line);stroke-width:1}.tsc .dl{stroke:var(--line);stroke-width:1}
.tsc .bg.warn{fill:var(--p-warn);opacity:.8}.tsc .bg.stop{fill:var(--p-stop);opacity:.9}
.tsc .lim{stroke-width:1.2;stroke-dasharray:4 3}.tsc .lim.stop{stroke:#d9534a}.tsc .lim.warn{stroke:#e2a23a}
.tsc .ln{fill:none;stroke-width:2;stroke-linejoin:round}.tsc .ln.w{stroke:var(--accent)}.tsc .ln.v{stroke:#5b3aa0}
@media (prefers-color-scheme:dark){.tsc .ln.v{stroke:#c6b2f2}}
.tsc .xh{stroke:var(--ink);stroke-width:1;opacity:.5}.tsc .xd{fill:var(--card);stroke-width:2}.tsc .xd.w{stroke:var(--accent)}.tsc .xd.v{stroke:#5b3aa0}
.tsc .tip{font-size:12.5px;min-height:18px;margin-top:2px}
/* 요약 숫자 칸 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:2px 0 4px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px}
.kpis span{display:block;font-size:11px;color:var(--muted);font-weight:700}.kpis b{display:block;font-size:20px;font-weight:800;color:var(--bc-title)}.kpis em{font-style:normal;font-size:10.5px;color:var(--muted)}
/* 사업 (자동) */
.pc{padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}.pc:first-child{border-top:0}.pc:active{background:var(--soft)}
.pc-t{font-weight:800;font-size:15.5px;line-height:1.38;margin-top:6px;color:var(--bc-title);overflow-wrap:anywhere}
.ch.mem2{background:var(--soft);font-size:12px}
.pbar{display:flex;align-items:center;gap:8px;margin-top:9px}
.pb{position:relative;flex:1;height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.pb i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.pb i.plan{background:color-mix(in srgb,var(--ci-blue) 25%,transparent)}.pb i.act{background:var(--ci-blue)}.pb i.act.late{background:#e2a23a}
.pbar.big .pb{height:12px}
.pv{flex:none;font-size:12.5px;font-variant-numeric:tabular-nums}.pv em{font-style:normal;color:var(--p-warn-ink);font-weight:800}
.pissue{margin-top:8px;background:var(--p-stop);color:var(--p-stop-ink);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:700;line-height:1.45}
.pissue.big div{font-weight:500;white-space:pre-line;margin-top:4px}
/* 새로고침 아이콘: 버튼이 아니라 아이콘만 제자리에서 돈다 (버튼째 돌리면 아이콘이 가운데가 아니라 흔들려 보임) */
.ak-icon-btn{display:inline-grid;place-items:center;padding:0;line-height:0}
.ak-icon-btn.ak-spin{animation:none}
.ak-icon-btn.ak-spin svg{animation:ak-spin .8s linear infinite;transform-origin:50% 50%;transform-box:fill-box}
/* 배 로딩: 물결은 옆으로 흐르고, 배는 왼쪽에서 오른쪽으로 가며 출렁인다 */
.boat-scene{width:200px;height:104px;display:block;margin:0 auto;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.boat-scene .wave path{fill:#7fc3e6}.boat-scene .w2 path{fill:#007ab5;opacity:.9}
.boat-scene .w1{animation:bs-wave 2.4s linear infinite}.boat-scene .w2{animation:bs-wave 1.6s linear infinite reverse}
.boat-scene .boat{animation:bs-sail 4.5s linear infinite}
.boat-scene .bob{transform-box:fill-box;transform-origin:50% 90%;animation:bs-bob 1.3s ease-in-out infinite alternate}
.boat-scene .hull{fill:#fff;stroke:#0b4466;stroke-width:2.5;stroke-linejoin:round}.boat-scene .stripe{stroke:#89b542;stroke-width:3}
.boat-scene .cabin{fill:#fff;stroke:#0b4466;stroke-width:2.5}.boat-scene .win{fill:#007ab5}
.boat-scene .mast{stroke:#0b4466;stroke-width:2.5}.boat-scene .flag{fill:#89b542}
@keyframes bs-wave{to{transform:translateX(-50px)}}
@keyframes bs-sail{0%{transform:translateX(-95px)}100%{transform:translateX(95px)}}
@keyframes bs-bob{0%{transform:translateY(0) rotate(-6deg)}100%{transform:translateY(3px) rotate(5deg)}}
.ak-boot .boat-scene{width:240px;height:125px}
.ak-boot p{margin:10px 0 0;font-weight:700;color:var(--ink)}.ak-boot p.sec2{margin-top:4px;font-weight:500;color:var(--muted);font-size:12.5px;min-height:18px}
.longload{position:fixed;left:50%;bottom:calc(84px + var(--sab));z-index:62;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  width:min(330px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px 14px 12px;text-align:center}
.longload.on{opacity:1;transform:translate(-50%,0)}
.longload .boat-scene{width:180px;height:94px}
.longload b{display:block;font-size:14px}.longload span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
@media (prefers-reduced-motion:reduce){.boat-scene .w1,.boat-scene .w2,.boat-scene .boat,.boat-scene .bob{animation-duration:9s}}

/* 공고 카드: 꼬리표 윗줄, 사업명 아랫줄 */
.bc-top{display:flex;align-items:center;gap:6px}
.bc-top .bstar{margin-left:auto}
.bc-top .newb,.bc-top .preb,.bc-top .rndb,.kindb{margin:0}
.kindb{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted)}
.bc-title{color:var(--bc-title);font-weight:800;font-size:15.5px;line-height:1.38;margin-top:5px;overflow-wrap:anywhere}
.orgh{display:flex;align-items:baseline;gap:8px;margin:12px 4px 6px}.orgh b{font-size:14px}.orgh span{color:var(--muted);font-size:12px}
.mapcap{font-size:11.5px;color:var(--muted);margin:5px 2px 2px}
/* 정렬 단추 */
.segs{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;margin:2px 0 8px}
.segs button{border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.segs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* 거르기 탭: 알약 + 건수 */
.fbar{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin-top:8px}
.fbar-A .fb{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:7px 8px 7px 13px;box-shadow:0 1px 3px rgba(0,0,0,.08),inset 0 0 0 1px var(--line);cursor:pointer;white-space:nowrap}
.fbar-A .fb em{font-style:normal;font-size:11.5px;min-width:22px;text-align:center;border-radius:999px;padding:1px 6px;background:var(--soft);color:var(--muted)}
.fbar-A .fb.on{background:var(--accent);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.fbar-A .fb.on em{background:rgba(255,255,255,.25);color:#fff}

/* 공고 카드 칸 맞춤 */
.ddtag{margin-left:auto;font-size:12px;font-weight:800;border-radius:7px;padding:2px 7px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.ddtag.hot{background:var(--p-stop);color:var(--p-stop-ink)}.ddtag.mid{background:var(--p-warn);color:var(--p-warn-ink)}
.bc-top .ddtag+.bstar{margin-left:2px}
.bc-org{font-size:13px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgrid{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:4px;margin-top:7px;background:var(--chip);border-radius:9px;padding:6px 8px}
.bgrid div{min-width:0}
.bgrid i{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}
.bgrid b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.bgrid b.amt{color:var(--bc-title)}.bgrid b small{font-weight:600;color:var(--muted);font-size:10.5px}
.bgrid.hist{background:var(--p-go)}.bgrid.hist i{color:color-mix(in srgb,var(--p-go-ink) 70%,transparent)}.bgrid.hist b{color:var(--p-go-ink)}
.orgsel{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:10px;padding:7px 10px;background:var(--soft);color:var(--muted);margin:2px 0 8px;max-width:58%}
.orgsel.on{background:var(--accent);color:#fff}
/* 3일 띠 눈금 */
.hstrip{position:relative;overflow:visible!important}
.hstrip b.cur{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 1.5px var(--card)}
.htk{position:relative;height:4px}.htk i{position:absolute;top:0;width:1px;height:4px;background:var(--muted);opacity:.6}
/* 위쪽 시간 막대: 하나로 이어진 막대 + 따라다니는 날짜·시간 핀 */
.tline{position:relative;flex:1;min-width:0;padding-top:30px}
.tin{position:relative;margin:0 11px}
.tpin{position:absolute;bottom:22px;width:0;height:30px;pointer-events:none;white-space:nowrap}
.tpin span{position:absolute;left:0;bottom:6px;transform:translateX(var(--bx,-50%));display:block;background:var(--accent);color:#fff;font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.tpin::after{content:"";position:absolute;left:-5px;bottom:-4px;width:0;height:0;border:5px solid transparent;border-top-color:var(--accent)}
.tpin{bottom:24px}
.trk{position:relative;height:22px;touch-action:none;cursor:pointer}
.trk::before{content:"";position:absolute;left:0;right:0;top:7px;height:8px;border-radius:4px;background:var(--soft)}
.tfill{position:absolute;left:0;top:7px;height:8px;border-radius:4px;background:var(--accent)}
.tknob{position:absolute;top:0;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25);box-sizing:border-box}
.tends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:2px}
.hticks{position:relative;height:14px;margin-top:2px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.hticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.hticks .st{left:0;transform:none}.hticks .en{right:0;left:auto;transform:none}
.spd{flex:none;height:30px;min-width:40px;border-radius:15px;border:0;background:var(--soft);color:var(--ink);font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
/* 건의함 */
.fbk{border-top:1px solid var(--line);padding:9px 0}.fbk:first-child{border-top:0}
.fst{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--muted)}
.fst.s1{background:var(--p-blue);color:var(--p-blue-ink)}.fst.s2{background:var(--p-warn);color:var(--p-warn-ink)}.fst.s3{background:var(--p-go);color:var(--p-go-ink)}
.freply{margin-top:5px;background:var(--soft);border-radius:8px;padding:6px 9px;font-size:13px}

/* 공고 카드 상자: 기본 정보 + 발주처 담당 / 지난 사업 (수행사·컨소시엄·낙찰률·투찰률·경쟁) */
.bbox{margin-top:7px;background:var(--chip);border-radius:9px;padding:6px 8px}
.bbox .bgrid{margin:0;padding:0;background:none}
.brow{display:flex;align-items:baseline;gap:6px;margin-top:5px;font-size:12.5px;min-width:0}
.brow i{flex:none;font-style:normal;font-size:10.5px;color:var(--muted)}
.brow b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .tel{margin-left:auto;flex:none;color:var(--accent);font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums}
.brow .cs{flex:none;margin-left:auto;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:rgba(255,255,255,.6);color:var(--p-go-ink)}
.bhist{margin-top:6px;background:var(--p-go);color:var(--p-go-ink);border-radius:9px;padding:7px 8px}
.bhist .bh-h{display:flex;align-items:baseline;gap:8px;font-size:12.5px}.bhist .bh-h span{font-size:11px;opacity:.85}
.bhist .brow i,.bhist .bgrid i{color:color-mix(in srgb,var(--p-go-ink) 70%,transparent)}
.bhist .bgrid{margin:5px 0 0;padding:0;background:none}.bhist .bgrid b{color:var(--p-go-ink)}
.mems{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.mems span{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.55);border-radius:6px;padding:1px 6px}
@media (prefers-color-scheme:dark){.mems span,.brow .cs{background:rgba(0,0,0,.25)}}

/* 입찰: 정렬 단추와 발주처 고르기를 한 줄에 */
.tools1{display:flex;align-items:center;gap:6px;margin:2px 0 8px}
.tools1 .segs{margin:0;flex:none}.tools1 .segs button{padding:6px 9px}
.tools1 .orgsel{margin:0;flex:1;min-width:0;max-width:none;height:34px}

/* 사업 상세 */
.pdd{font-size:12px;font-weight:800;border-radius:8px;padding:3px 9px;background:var(--soft);color:var(--muted)}
.pdd.hot{background:var(--p-stop);color:var(--p-stop-ink)}.pdd.mid{background:var(--p-warn);color:var(--p-warn-ink)}
.pcons{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:4px 0 10px}
ul.pl{margin:4px 0 0;padding:0;list-style:none}
ul.pl li{position:relative;padding:7px 0 7px 16px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
ul.pl li:last-child{border-bottom:0}
ul.pl li::before{content:"";position:absolute;left:3px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.pband{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--accent),#0b4466);color:#fff;border-radius:16px;padding:14px;margin-bottom:10px}
.pband h2{margin:4px 0 8px;font-size:17px;line-height:1.35}.pbt{font-size:12px;opacity:.85}.pband .pdd{background:rgba(255,255,255,.2);color:#fff}
.pring{width:80px;height:80px;flex:none}.pring circle{fill:none;stroke-width:8}.pring .bg{stroke:rgba(255,255,255,.25)}
.pring .fg{stroke:#fff;stroke-linecap:round;transform:rotate(-90deg);transform-origin:38px 38px}.pring .fg.late{stroke:#ffd27a}
.pring text{fill:#fff;font-size:16px;font-weight:800;text-anchor:middle}.pring text.s{font-size:9px;font-weight:600;opacity:.85}
.ptab{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}.ptab th{width:84px;text-align:left;color:var(--muted);font-weight:600;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}.ptab td{padding:8px 0;border-bottom:1px solid var(--line);font-weight:600}
.psec{border-left:3px solid var(--accent);padding-left:10px;margin:12px 0}.psec h3{margin:0;font-size:14px}
.psec.s-done{border-left-color:#1f7fd0}.psec.s-done h3{color:#1f7fd0}.psec.s-done ul.pl li:before{background:#1f7fd0}
.psec.s-next{border-left-color:#2e9e5b}.psec.s-next h3{color:#2e9e5b}.psec.s-next ul.pl li:before{background:#2e9e5b}
.psec.s-ev{border-left-color:#7c5cd6}.psec.s-ev h3{color:#7c5cd6}
@media (prefers-color-scheme:dark){.psec.s-done h3{color:#6cb4ef}.psec.s-next h3{color:#6fcf97}.psec.s-ev h3{color:#b39cf2}}
.todo{background:var(--p-stop);border-radius:14px;padding:10px 12px;margin-bottom:14px}.todo-h{font-weight:800;color:var(--p-stop-ink);margin-bottom:4px}
.todo-r{gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:center}.todo-r .chip{flex:none}
.pcal h3 small{font-weight:500;color:var(--muted);font-size:11.5px;margin-left:4px}
.pcm{margin-top:10px}.pcmh{font-weight:800;font-size:13.5px;margin-bottom:4px}
.pcg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.pcw{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}.pcw.sun{color:var(--stop)}.pcw.sat{color:var(--bc-title)}
.pcd{border:0;background:none;font:inherit;color:var(--ink);height:36px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 0 0;position:relative;cursor:default}
.pcd b{font-size:13px;font-weight:500;width:24px;height:24px;line-height:24px;border-radius:50%}
.pcd.sun b{color:var(--stop)}.pcd.sat b{color:var(--bc-title)}.pcd.past{opacity:.55}
.pcd.has{cursor:pointer}.pcd.has b{font-weight:800}
.pcd.today b{background:var(--bc-title);color:#fff}
.pcd.rng:before{content:'';position:absolute;left:0;right:0;top:4px;height:24px;background:var(--p-violet);z-index:-1}
.pcd.rs:before{left:50%;margin-left:-12px;border-radius:12px 0 0 12px}.pcd.re:before{right:50%;margin-right:-12px;border-radius:0 12px 12px 0}.pcd.rs.re:before{border-radius:12px}
.pcd{z-index:0;isolation:isolate}
.pcd.sel b{outline:2px solid var(--bc-title);outline-offset:1px}
.pcd i{display:flex;gap:2px;margin-top:2px;height:5px}
.pcal u{display:inline-block;width:5px;height:5px;border-radius:50%;text-decoration:none}
u.e{background:#7c5cd6}u.n{background:#2e9e5b}u.d{background:#8a96a3}u.i{background:var(--stop)}u.x{background:#e08a00}
.pclg{display:flex;gap:10px;font-size:11px;color:var(--muted);margin:6px 0 4px}.pclg u{margin-right:4px;vertical-align:1px}
.pcl{list-style:none;margin:6px 0 0;padding:0}
.pcl li{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.pcl li.past{opacity:.6}.pcl li[hidden]{display:none}
.pcdt{flex:none;width:62px;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.pck{flex:none;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;color:#fff}
.pck.e{background:#7c5cd6}.pck.n{background:#2e9e5b}.pck.d{background:#8a96a3}.pck.i{background:var(--stop)}.pck.x{background:#e08a00}
.pct{min-width:0}

<script>
/* ═══ app-kit.js — 모바일 웹앱 공통 동작 ═══
   AppKit.fixViewport()            화면 높이 보정 (아이폰 홈 화면 앱 위아래 공백 제거)
   AppKit.bootDone()               첫 로딩 화면 걷기
   AppKit.track(promise, opts)     진행 막대 + 알약 + 누른 버튼 스피너
   AppKit.wrap(fn, skip)           API 함수를 감싸 "방금 누른 동작"만 자동으로 진행 표시
   AppKit.spin(el, promise)        새로고침 아이콘 돌리기 (배경 새로고침용)
   AppKit.toast(msg)               짧은 알림
   AppKit.swipe(el, {onNext,onPrev})  좌우 스와이프 (탭·날짜 넘기기)
   AppKit.tabs({...})              탭바 + 스와이프 + 넘김 애니메이션
   AppKit.sheet(el)                바텀시트 열기/닫기 + 끌어내려 닫기
   AppKit.autoUpdate(build)        version.txt 가 바뀌면 새 버전으로 다시 열기
   AppKit.env()                    진단 문구 (버전·홈 화면 앱 여부·화면 크기)
   AppKit.store('앱접두어')         localStorage 를 안전하게 (get/set/del)
   AppKit.esc / num / krw / signed / kstDate / addDays / hhmm   글자·숫자·날짜
   AppKit.poll(fn, ms, busy)       화면이 보일 때만 자동 새로고침 + 돌아오면 즉시
   AppKit.editing(view)            입력 중인지 (배경 새로고침이 입력값을 지우지 않게)
   AppKit.sequence()               늦게 온 예전 응답 버리기
   AppKit.showErrors(build)        앱 오류를 화면에 표시
   AppKit.sure(btn)                두 번 눌러야 지워지는 버튼
   AppKit.copy(text) / buzz()      복사 · 진동
   AppKit.toJpeg(file, maxSide)    사진 줄여서 올리기
   AppKit.device()                 접속 기록용 기기·방식 */
const AppKit = (() => {
  const $ = s => typeof s === 'string' ? document.querySelector(s) : s;
  const root = document.documentElement;
  const standalone = () => !!navigator.standalone || matchMedia('(display-mode: standalone)').matches;

  /* ── 1. 화면 높이 ──
     아이폰 홈 화면 앱은 웹 화면(innerHeight)을 실제 화면보다 짧게 잡을 때가 있다.
     그 차이(gap)만큼 문서 높이를 늘려 맨 아래 빈 띠를 없앤다. 가로 모드·브라우저에서는 보정하지 않는다. */
  let gap = 0;
  function fixViewport() {
    const set = () => {
      const portraitH = Math.max(screen.height, screen.width);
      const raw = innerHeight < innerWidth ? 0 : portraitH - innerHeight;
      gap = standalone() && raw > 0 && raw < 160 ? raw : 0;
      root.style.setProperty('--app-h', (innerHeight + gap) + 'px');
      root.classList.toggle('standalone', standalone());
    };
    set();
    addEventListener('resize', set);
    addEventListener('orientationchange', () => setTimeout(set, 300));
  }

  /* ── 2. 로딩 ── */
  function bootDone() { const b = $('.ak-boot'); if (!b) return; b.classList.add('out'); setTimeout(() => b.remove(), 300); }

  let tapAt = 0, tapEl = null, busyN = 0, pillTm = 0, busyLabel = '잠깐만요, 처리 중이에요', busyEmoji = '⏳';
  ['pointerdown', 'change'].forEach(t => document.addEventListener(t, e => {
    tapAt = Date.now();
    if (t === 'pointerdown') tapEl = e.target.closest?.('button,label,.btn,[role=button]') || null;
  }, true));
  function busyUI(on, label) {
    let bar = $('.ak-bar'), pill = $('.ak-pill');
    if (on) {
      if (!bar) { bar = document.createElement('div'); bar.className = 'ak-bar'; document.body.appendChild(bar); }
      if (!pill) { pill = document.createElement('div'); pill.className = 'ak-pill'; pill.setAttribute('role', 'status'); document.body.appendChild(pill); }
      pill.innerHTML = `<span class="e">${busyEmoji}</span><span></span><span class="d"><i></i><i></i><i></i></span>`;
      pill.children[1].textContent = label || busyLabel;
      pill.classList.toggle('top', !!$('.ak-sheet.on'));           // 시트가 열려 있으면 버튼을 가리지 않게 위로
      requestAnimationFrame(() => bar.classList.add('on'));
      clearTimeout(pillTm); pillTm = setTimeout(() => pill.classList.add('on'), 350);   // 금방 끝나면 알약은 안 띄움
    } else {
      clearTimeout(pillTm); bar?.classList.remove('on'); pill?.classList.remove('on');
      document.querySelectorAll('.is-busy').forEach(x => x.classList.remove('is-busy'));
    }
  }
  function track(p, { el, label } = {}) {
    busyN++; const b = $(el) || tapEl; if (b && document.contains(b)) b.classList.add('is-busy'); busyUI(true, label);
    const done = () => { if (--busyN <= 0) { busyN = 0; busyUI(false); } };
    p.then(done, done); return p;
  }
  /* 사용자가 누른 지 1.5초 안에 시작된 요청만 표시한다. 배경 새로고침은 조용히. */
  function wrap(fn, skip) {
    return function (...a) {
      const p = fn.apply(this, a);
      if (Date.now() - tapAt > 1500 || (skip && skip(...a))) return p;
      return track(p);
    };
  }

<script>
/* 로딩이 길어질 때: 1.5초 넘으면 배 카드를 띄우고, 걸린 시간에 따라 상태를 알려 준다 */
const LONG_MSG = { load: '공고·현장 날씨를 불러오는 중', weatherNow: '기상청에서 날씨를 받는 중', siteAdd: '지점을 저장하고 날씨를 받는 중', siteSave: '지점을 저장하는 중', login: '로그인하는 중' };
const Long = (() => {
  let n = 0, t0 = 0, tm = 0, iv = 0, label = '';
  const el = () => document.getElementById('longload');
  const sub = sec => sec < 6 ? `${sec}초째 · 거의 다 왔어요` : sec < 12 ? `${sec}초째 · 구글 서버가 깨어나는 중이라 조금 걸려요` : sec < 25 ? `${sec}초째 · 공공데이터 서버 응답을 기다리는 중` : `${sec}초째 · 네트워크가 느려요. 계속 기다리는 중`;
  function paint() { const sec = Math.round((Date.now() - t0) / 1000); document.getElementById('llMsg').textContent = label + '…'; document.getElementById('llSub').textContent = sub(sec); }
  return {
    begin(a) { if (n++ === 0) { t0 = Date.now(); label = LONG_MSG[a] || '처리하는 중'; tm = setTimeout(() => { if (!document.querySelector('.ak-boot')) { paint(); el()?.classList.add('on'); document.querySelector('.ak-pill')?.classList.add('hidden'); iv = setInterval(paint, 1000); } }, 1500); } },
    end() { if (--n <= 0) { n = 0; clearTimeout(tm); clearInterval(iv); el()?.classList.remove('on'); document.querySelector('.ak-pill')?.classList.remove('hidden'); } },
  };
})();
/* 첫 화면 문구도 시간에 따라 바뀐다 */
(() => { const t0 = Date.now(), M = ['올포오션을 여는 중…', '공고와 현장 날씨를 불러오는 중…', '조금 오래 걸리고 있어요…'];
  const iv = setInterval(() => { const b = document.querySelector('.ak-boot'); if (!b) return clearInterval(iv); const sec = Math.round((Date.now() - t0) / 1000);
    document.getElementById('bootMsg').textContent = M[sec < 3 ? 0 : sec < 10 ? 1 : 2]; document.getElementById('bootSub').textContent = sec >= 3 ? `${sec}초째 · 구글 서버가 깨어나는 중이면 10~20초 걸릴 수 있어요` : ''; }, 1000); })();
const BUILD = '1794657374';
AppKit.fixViewport();
setTimeout(() => window.fitScreen && fitScreen(), 0);
AppKit.autoUpdate(BUILD);
AppKit.showErrors(BUILD);
AppKit.setBusy({ label: '처리 중이에요', emoji: '🌊' });
const LS = AppKit.store('badapan');
const { esc } = AppKit;
/* Apps Script …/exec 주소. 공개돼도 괜찮은 값이에요(로그인 없이는 아무것도 못 읽어요). 비어 있으면 예시 모드 */
const API_URL = 'https://script.google.com/macros/s/AKfycbwQD3Ul-x_q--NIcevQuMTzWLIwrXf1-TcwpJgSUfY7SPT3w4aF9kmsP3pS2l8dUo_gkg/exec';
const S = {
  demo: !API_URL || location.hash === '#demo',
  auth: LS.get('auth', null),           // { token, name } — 비밀번호는 저장하지 않아요
  data: null, lastOk: null,
  bidF: LS.get('bidF', 'all'), bidQ: '', bidSort: LS.get('bidSort', 'close'), bidOrg: '', speed: LS.get('speed', 1), soonSort: LS.get('soonSort', 'close'), bidMap: LS.get('bidMap', false), bidAt: '', tIdx: 0, projF: LS.get('projF', 'all'),
};
if (!S.demo && S.auth) S.data = LS.get('data', null);
document.getElementById('demo').hidden = !S.demo;
const today = () => S.data?.today || AppKit.kstDate();

/* ── 날짜·숫자 ── */
const WD = '일월화수목금토';
const md = s => { if (!s) return ''; const d = new Date(s.slice(0, 10) + 'T00:00:00Z'); return `${d.getUTCMonth() + 1}.${d.getUTCDate()}(${WD[d.getUTCDay()]})`; };
const dday = s => Math.round((new Date(s.slice(0, 10) + 'T00:00:00Z') - new Date(today() + 'T00:00:00Z')) / 864e5);
const ddTxt = n => n === 0 ? 'D-day' : n > 0 ? 'D-' + n : '마감';
const ddCls = n => n < 0 ? 'done' : n <= 3 ? 'hot' : n <= 7 ? 'mid' : '';
const won = n => !n ? '' : n >= 1e8 ? (Math.round(n / 1e7) / 10).toString() + '억 원' : Math.round(n / 1e4).toLocaleString('ko-KR') + '만 원';
const ago = t => { const m = Math.round((Date.now() - new Date(t)) / 6e4); return m < 1 ? '방금' : m < 60 ? m + '분 전' : m < 1440 ? Math.round(m / 60) + '시간 전' : md(AppKit.kstDate(new Date(t))); };
const coTag = c => c ? `<span class="tag ${c === '엘티메트릭' ? 'ltm' : 'alf'}">${esc(c)}</span>` : '';
const role = () => S.data?.me?.role || 'member';
const isLead = () => ['lead', 'head', 'admin'].includes(role());
const isAdmin = () => role() === 'admin';
const ROLE_NAME = { member: '팀원', lead: '팀장', head: '본부장', admin: '관리자' };

/* 현장 신호: 특보가 있거나 기준을 넘으면 중지, 기준의 80%를 넘으면 주의 */
function signal(s) {
  if (s.warn) return { c: 'stop', t: s.warn };
  if (!s.now || (s.now.wave == null && s.now.wind == null)) return { c: 'none', t: s.wxErr ? '자료 오류' : '받는 중' };
  const w = s.now.wave ?? 0, v = s.now.wind ?? 0;
  if (w > s.maxWave || v > s.maxWind) return { c: 'stop', t: '작업 불가' };
  if (w > s.maxWave * .8 || v > s.maxWind * .8) return { c: 'warn', t: '작업 유의' };
  return { c: 'go', t: '작업 적합' };
}

/* ══ 서버 호출 ══ */
let api = async (action, payload = {}) => {
  const quiet = action === 'load' && S.data && !S.loud; if (!quiet) Long.begin(action);
  try { return await apiRaw(action, payload); } finally { if (!quiet) Long.end(); }
};
async function apiRaw(action, payload) {
  if (S.demo) return Demo.call(action, payload);
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, cache: 'no-store',
      body: JSON.stringify({ action, token: S.auth?.token || '', meta: AppKit.device(), ...payload }) });
  } catch (e) { throw new Error('서버에 연결하지 못했어요. 잠시 후 다시 해주세요.'); }
  const j = await r.json().catch(() => ({ ok: false, message: '서버 응답을 읽지 못했어요.' }));
  if (!j.ok) {
    if (j.code === 'auth') { signOut(j.message || '다시 로그인해 주세요.'); }
    throw Object.assign(new Error(j.message || '처리하지 못했어요'), { code: j.code });
  }
  return j.data;
};
api = AppKit.wrap(api, a => a === 'load' || a === 'ping');

/* ══ 불러오기 ══ */
const seq = AppKit.sequence();
async function refresh() {
  if (!S.demo && !S.auth) return;
  const mine = seq.next();
  try {
    const d = await AppKit.spin('#refresh', api('load'));
    if (!seq.is(mine)) return;
    S.data = d; S.lastOk = new Date(); if (!S.demo) LS.set('data', d);
    document.getElementById('dot').className = 'ak-dot live';
    document.getElementById('st').textContent = AppKit.hhmm(S.lastOk) + ' 갱신';
    if (!sheet.isOpen && !AppKit.editing()) tabs.go(tabs.current, 0);
    announceNews();
  } catch (e) {
    document.getElementById('dot').className = 'ak-dot off';
    document.getElementById('st').textContent = S.lastOk ? AppKit.hhmm(S.lastOk) + ' 이후 연결 안 됨' : '연결 안 됨';
    if (e.code !== 'auth') AppKit.toast(e.message);
    if (!S.data) document.getElementById('sc').innerHTML = `<div class="ak-empty">불러오지 못했어요<br><button type="button" data-act="retry">다시 시도</button></div>`;
  }
}

   공고 제목·수요기관에서 지명을 찾아 대략 위치를 잡고, 현장 지점을 찍으면 가까운 조위관측소와 특보 해역을 추천한다. */

function kmBetween(a, b) {
  const R = Math.PI / 180, x = (b.lon - a.lon) * R * Math.cos((a.lat + b.lat) / 2 * R), y = (b.lat - a.lat) * R;
  return Math.sqrt(x * x + y * y) * 6371;

function seaZone(p) {
  const near = GAZ.some(g => g.n.length >= 2 && kmBetween(p, g) < 30) ? '앞바다' : '먼바다';
  const { lat, lon } = p;
  if (lat < 33.9 && lon < 127.5) return lat < 33.1 ? '제주도남쪽먼바다' : '제주도' + near;
  if (lon >= 128.9 && lat >= 35.35) return (lat >= 37 ? '동해중부' : '동해남부') + near;
  if (lat < 35.0 && lon >= 127.9) return '남해동부' + near;
  if (lat < 34.75 && lon >= 125.9) return '남해서부' + near;
  if (lon >= 127.9) return '남해동부' + near;
  return (lat >= 36.2 ? '서해중부' : '서해남부') + near;
}

/* 3일 그래프 (파고·풍속을 따로 — 눈금이 다른 두 값을 한 그래프에 겹치지 않는다) */

      ${s.ts.map((r, i) => { const c = judge(s, r[1], r[2]); return c === 'go' || c === 'none' ? '' : `<rect x="${x(i).toFixed(1)}" y="${P.t}" width="${(bw(i) + .5).toFixed(1)}" height="${H - P.t - P.b}" class="bg ${c}"/>`; }).join('')}

function tsHover(e) {

${url}` };

async function invite(copyOnly) {

/* 아이폰 홈 화면 앱은 키보드가 올라갔다 내려가면 앱 높이를 실제 보이는 화면보다 크게 남기고 문서를 밀어 둔다.
   (위가 밀리거나, 위치만 되돌리면 아래 탭바가 잘린다) → 입력 중이 아닐 때는 앱 높이를 "지금 보이는 화면 높이"로 맞추고 맨 위로 되돌린다. */
const typing = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
function fitScreen() {
  if (typing()) return;
  const vh = Math.round(window.visualViewport?.height || innerHeight);
  if (innerHeight < innerWidth) return;                       // 가로 화면은 건드리지 않음
  document.documentElement.style.setProperty('--app-h', vh + 'px');
  if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; }
}
function resetScroll() { fitScreen(); requestAnimationFrame(fitScreen); setTimeout(fitScreen, 150); setTimeout(fitScreen, 450); }
document.addEventListener('focusout', () => setTimeout(() => { if (!typing()) resetScroll(); }, 80));
window.visualViewport?.addEventListener('resize', () => setTimeout(fitScreen, 60));
addEventListener('resize', () => setTimeout(fitScreen, 60));
addEventListener('orientationchange', () => setTimeout(fitScreen, 400));
addEventListener('pageshow', resetScroll);
function gErr(t) { const e = document.getElementById('gerr'); if (e) e.textContent = t; const p = document.getElementById('gpin'); if (p) { p.value = ''; p.focus(); } AppKit.buzz(30); }
function signOut(msg) {

}

}
async function gateAct(k) {

    const name = k === 'unlock' ? S.auth.name : v('gname'), pin = v('gpin');
    if (!name) return gErr('이름을 넣어 주세요');
    if (!/^\d{6}$/.test(pin)) return gErr('비밀번호는 숫자 6자리예요');

    try {
      const r = await api(k, { name, pin, device: AppKit.device().dev });
      if (k === 'login') { S.auth = { token: r.token, name: r.name }; LS.set('auth', S.auth); LS.set('lastName', r.name); }
      LS.set('seenAt', Date.now()); document.activeElement?.blur?.(); gate.hidden = true; gate.innerHTML = ''; resetScroll();

  }

    if (!/^\d{6}$/.test(pin)) return gErr('비밀번호는 숫자 6자리예요');
    if (/^(\d)\1{5}$/.test(pin) || '0123456789'.includes(pin) || '9876543210'.includes(pin)) return gErr('너무 쉬운 비밀번호예요. 다른 숫자로 해주세요');

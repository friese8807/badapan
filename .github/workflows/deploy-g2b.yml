# 개찰알림(friese8807/g2b) 서버 자동 배포 — 이 저장소의 clasp 로그인(CLASPRC_JSON)을 같이 쓴다.
# g2b main 의 apps-script/Code.gs 가 마지막 배포와 다르면 붙여 넣고 같은 웹앱 배포에 새 버전을 올린다(앱 주소 그대로).
# shortcut: g2b 푸시로 바로 돌지 않고 15분마다 확인한다, g2b 저장소에 CLASPRC_JSON 비밀값을 넣으면 g2b 쪽 push 트리거로 옮길 것
name: 개찰알림 서버 배포
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
concurrency: g2b-deploy
env:
  SCRIPT_ID: 1QNzNR_6yKs2lgRwm0F1gNgLSaWLwwYb64nk5CNTZCgqmZk3CH2d3rP2d   # 개찰알림 Apps Script
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: friese8807/g2b, ref: main, path: g2b, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 바뀌었으면 붙여 넣고 새 버전 배포
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          [ -n "$CLASPRC" ] || { echo "::error::CLASPRC_JSON 비밀값이 없어요"; exit 1; }
          SHA=$(git -C g2b log -1 --format=%h -- apps-script/Code.gs)
          node -e "new Function(require('fs').readFileSync('g2b/apps-script/Code.gs','utf8'))"
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          mkdir gas && cd gas && printf '{"scriptId":"%s"}' "$SCRIPT_ID" > .clasp.json
          C="npx -y @google/clasp@2.4.2"
          L=$($C deployments 2>&1); echo "$L"
          echo "$L" | grep -q "자동 $SHA" && { echo "이미 배포됨 ($SHA)"; rm -f ~/.clasprc.json; exit 0; }
          # 앱이 부르는 웹앱 배포 = @HEAD 가 아닌 것 중 버전이 가장 큰 것
          DEPLOY_ID=$(echo "$L" | grep -E '^- \S+ @[0-9]+' | sort -t@ -k2 -n | tail -1 | awk '{print $2}')
          [ -n "$DEPLOY_ID" ] || { echo "::error::웹앱 배포를 못 찾았어요"; exit 1; }
          $C pull; test -f Code.js || { echo "::error::서버에 Code 파일이 없어요"; exit 1; }
          cp ../g2b/apps-script/Code.gs Code.js
          P=$($C push -f 2>&1); echo "$P"; echo "$P" | grep -q "Pushed" || { echo "::error::붙여 넣기 실패: $(echo "$P" | tail -1)"; exit 1; }
          D=$($C deploy -i "$DEPLOY_ID" -d "자동 $SHA" 2>&1); echo "$D"; echo "$D" | grep -q "$DEPLOY_ID @" || { echo "::error::배포 실패: $(echo "$D" | tail -1)"; exit 1; }
          echo "::notice::개찰알림 배포 완료 $(echo "$D" | grep -o '@[0-9]*') · $SHA"
          rm -f ~/.clasprc.json
